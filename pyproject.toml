[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bondalorians"
version = "0.1.0"
description = "Explainable comparable-bond pricing agent prototype"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.39,<2",
  "langgraph>=0.2,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "plotly>=5.24,<7",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "mistralai>=1.2,<3",
  "quantlib>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
